name: Debug OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.info('OIDC token obtained (length: ' + token.length + ')');
            // Decode the JWT payload (middle part)
            const parts = token.split('.');
            const payload = JSON.parse(Buffer.from(parts[1], 'base64url').toString());
            core.info('Subject: ' + payload.sub);
            core.info('Audience: ' + JSON.stringify(payload.aud));
            core.info('Repository: ' + payload.repository);
            core.info('Event: ' + payload.event_name);
            core.info('Ref: ' + payload.ref);
            core.info('SHA: ' + payload.sha);
            core.info('Full claims: ' + JSON.stringify(payload, null, 2));
