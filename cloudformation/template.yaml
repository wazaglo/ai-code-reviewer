AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AI Code Reviewer - production-hardened automated PR/MR review on Amazon Bedrock.
  API Gateway (webhook, signature-verified) -> Ingest Lambda -> SQS (+DLQ) ->
  Worker Lambda -> Bedrock Nova -> GitHub/GitLab comment. Secrets in AWS Secrets
  Manager, X-Ray tracing, CloudWatch alarms, WAF + stage throttling for cost guard.
  Cost attribution via DynamoDB per provider/org/repo/month.

Parameters:
  # ------------------------------------------------------------------
  # Code hosting (populated by ./deploy/deploy.sh)
  # ------------------------------------------------------------------
  CodeBucket:
    Type: String
    Description: S3 bucket that holds the packaged Lambda code and layer zips.

  CodeKeyPrefix:
    Type: String
    Default: pr-reviewer
    Description: S3 object key prefix under CodeBucket for the packaged artifacts.

  # ------------------------------------------------------------------
  # Naming
  # ------------------------------------------------------------------
  QueueName:
    Type: String
    Default: PR-Review-Queue
    Description: SQS queue that buffers webhook events.

  LambdaFunctionName:
    Type: String
    Default: PR-Review-Worker
    Description: Worker Lambda that processes queued pull/merge requests.

  IngestFunctionName:
    Type: String
    Default: PR-Review-Ingest
    Description: Ingest/verifier Lambda behind the webhook.

  AuthorizerFunctionName:
    Type: String
    Default: PR-Review-Authorizer
    Description: >
      Cognito Bearer-token authorizer Lambda. Direct API callers need a valid
      token; Git-provider webhooks are exempted by User-Agent.

  ApiName:
    Type: String
    Default: PR-Reviewer-API
    Description: REST API Gateway name.

  CostTableName:
    Type: String
    Default: PR-Review-CostAttribution
    Description: DynamoDB table for cost attribution per provider/org/repo/month.

  # ------------------------------------------------------------------
  # Bedrock model - change the ARN/model here in ONE place
  # ------------------------------------------------------------------
  BedrockModelId:
    Type: String
    Default: 'amazon.nova-lite-v1:0'
    AllowedPattern: '.+'
    Description: >
      Bedrock foundation-model ID used for AI analysis. Change to switch models;
      the IAM permission ARN and the runtime BOTH derive from this field.

  # ------------------------------------------------------------------
  # Secrets (never logged / echoed)
  # ------------------------------------------------------------------
  GitHubWebhookSecret:
    Type: String
    NoEcho: true
    Description: >
      The secret you configure against your GitHub webhook. Used to verify the
      X-Hub-Signature-256 on every request so only GitHub can trigger reviews.
      Leave empty if not using GitHub.

  GitHubToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      GitHub Personal Access Token (fine-grained, contents:read +
      pull_requests:write) used to clone and post comments. Leave empty for
      public-repo dry runs or if not using GitHub.

  GitLabWebhookSecret:
    Type: String
    NoEcho: true
    Description: >
      The secret token you configure against your GitLab webhook. Used to verify
      the X-Gitlab-Token header. Leave empty if not using GitLab.

  GitLabToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      GitLab Personal Access Token (api scope) used to fetch MR changes and post
      notes. Leave empty if not using GitLab.

  GitLabApiUrl:
    Type: String
    Default: 'https://gitlab.com/api/v4'
    Description: GitLab API base URL (for self-hosted instances).

  # ------------------------------------------------------------------
  # Compute sizing
  # ------------------------------------------------------------------
  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240

  LambdaTimeout:
    Type: Number
    Default: 300
    MinValue: 3
    MaxValue: 900

  VisibilityTimeout:
    Type: Number
    Default: 360
    MinValue: 30
    Description: SQS visibility timeout (must be >= Lambda timeout).

  # DLQ: number of delivery attempts before a message is redriven to the DLQ.
  MaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000

  # Comma-separated org/repo allowlist. Default empty = allow anything.
  # Format: github:org/repo,gitlab:group/project
  RepoAllowlist:
    Type: String
    Default: ''
    Description: 'Comma-separated list of allowed repos, e.g. github:acme/web,gitlab:acme/backend. Empty allows all.'

  # ------------------------------------------------------------------
  # Rate limiting / cost protection
  # ------------------------------------------------------------------
  ApiStageRateLimit:
    Type: Number
    Default: 10
    MinValue: 0
    Description: Requests per second at the API stage (0 = unlimited).

  ApiStageBurstLimit:
    Type: Number
    Default: 20
    MinValue: 0

  WafRateLimit:
    Type: Number
    Default: 200
    MinValue: 100
    MaxValue: 2000000000
    Description: WAF rule limit - max requests from a single IP within 5 minutes.

  MonthlyBudgetLimit:
    Type: Number
    Default: 50
    Description: Monthly AWS spend budget limit in USD that triggers an alarm.

  NotificationEmail:
    Type: String
    Default: ''
    Description: Email that receives cost/spend budget and alarm notifications.

Conditions:
  NotifyEnabled: !Not [ !Equals [ !Ref NotificationEmail, '' ] ]
  GitHubEnabled: !Not [ !Equals [ !Ref GitHubToken, '' ] ]
  GitLabEnabled: !Not [ !Equals [ !Ref GitLabToken, '' ] ]
  CostTableEnabled: !Not [ !Equals [ !Ref CostTableName, '' ] ]

Resources:
  # ==================================================================
  # Secrets Manager - never store tokens in env vars or code
  # ==================================================================
  WebhookSecret:
    Type: AWS::SecretsManager::Secret
    Condition: GitHubEnabled
    Properties:
      Description: GitHub webhook HMAC secret used to verify webhook signatures
      SecretString: !Ref GitHubWebhookSecret

  GitLabWebhookSecretStore:
    Type: AWS::SecretsManager::Secret
    Condition: GitLabEnabled
    Properties:
      Description: GitLab webhook secret token used to verify webhook signatures
      SecretString: !Ref GitLabWebhookSecret

  GitHubTokenSecret:
    Type: AWS::SecretsManager::Secret
    Condition: GitHubEnabled
    Properties:
      Description: GitHub PAT used to clone repos and post PR comments
      SecretString: !Ref GitHubToken

  GitLabTokenSecret:
    Type: AWS::SecretsManager::Secret
    Condition: GitLabEnabled
    Properties:
      Description: GitLab PAT used to fetch MR changes and post notes
      SecretString: !Ref GitLabToken

  # ==================================================================
  # DynamoDB - Cost Attribution Table
  # ==================================================================
  CostAttributionTable:
    Type: AWS::DynamoDB::Table
    Condition: CostTableEnabled
    Properties:
      TableName: !Ref CostTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: PR-Reviewer

  # ==================================================================
  # SQS - main review queue + dead-letter queue
  # ==================================================================
  ReviewQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref QueueName
      VisibilityTimeout: !Ref VisibilityTimeout
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReviewQueueDLQ.Arn
        maxReceiveCount: !Ref MaxReceiveCount

  ReviewQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${QueueName}-dlq'
      MessageRetentionPeriod: 1209600

  # ==================================================================
  # IAM - ingest Lambda role (verify + enqueue)
  # ==================================================================
  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole

  IngestRolePolicies:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PRReview-Ingest
      Roles: [!Ref IngestRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt ReviewQueue.Arn
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: '*'

  IngestGitHubSecretPolicy:
    Type: AWS::IAM::Policy
    Condition: GitHubEnabled
    Properties:
      PolicyName: PRReview-Ingest-GitHubSecret
      Roles: [!Ref IngestRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref WebhookSecret

  IngestGitLabSecretPolicy:
    Type: AWS::IAM::Policy
    Condition: GitLabEnabled
    Properties:
      PolicyName: PRReview-Ingest-GitLabSecret
      Roles: [!Ref IngestRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref GitLabWebhookSecretStore

  # ==================================================================
  # IAM - worker Lambda role (read + analyze + post)
  # ==================================================================
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole

  WorkerRolePolicies:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PRReview-Worker
      Roles: [!Ref WorkerRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ReceiveMessage
            Resource: !GetAtt ReviewQueue.Arn
          - Effect: Allow
            Action: bedrock:InvokeModel
            Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: '*'

  WorkerGitHubSecretPolicy:
    Type: AWS::IAM::Policy
    Condition: GitHubEnabled
    Properties:
      PolicyName: PRReview-Worker-GitHubSecret
      Roles: [!Ref WorkerRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref GitHubTokenSecret

  WorkerGitLabSecretPolicy:
    Type: AWS::IAM::Policy
    Condition: GitLabEnabled
    Properties:
      PolicyName: PRReview-Worker-GitLabSecret
      Roles: [!Ref WorkerRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref GitLabTokenSecret

  WorkerCostTablePolicy:
    Type: AWS::IAM::Policy
    Condition: CostTableEnabled
    Properties:
      PolicyName: PRReview-Worker-CostTable
      Roles: [!Ref WorkerRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
              - dynamodb:PutItem
            Resource: !GetAtt CostAttributionTable.Arn

  # ==================================================================
  # Lambda layer - bundles the `requests` dependency
  # ==================================================================
  RequestsLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: PR-Review-requests
      Description: requests + urllib3 + certifi runtime dependency
      Content:
        S3Bucket: !Ref CodeBucket
        S3Key: !Sub '${CodeKeyPrefix}/requests-layer.zip'
      CompatibleRuntimes:
        - python3.12

  # ==================================================================
  # Lambda - ingest / verifier (webhook proxy)
  # ==================================================================
  IngestFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - IngestRolePolicies
    Properties:
      FunctionName: !Ref IngestFunctionName
      Role: !GetAtt IngestRole.Arn
      Runtime: python3.12
      Handler: ingest.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Sub '${CodeKeyPrefix}/ingest.zip'
      Layers: [!Ref RequestsLayer]
      Timeout: 30
      MemorySize: 128
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          QUEUE_URL: !Ref ReviewQueue
          WEBSECRET_ARN: !If [GitHubEnabled, !Ref WebhookSecret, '']
          GITLAB_WEBSECRET_ARN: !If [GitLabEnabled, !Ref GitLabWebhookSecretStore, '']

  # Allow API Gateway to invoke the ingest function from the webhook method.
  IngestInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IngestFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ReviewApi}/*/POST/webhook'

  # ==================================================================
  # Lambda - review worker (SQS consumer)
  # ==================================================================
  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - WorkerRolePolicies
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Role: !GetAtt WorkerRole.Arn
      Runtime: python3.12
      Handler: lambda_function.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Sub '${CodeKeyPrefix}/lambda_function.zip'
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref MemorySize
      TracingConfig:
        Mode: Active
      Layers: [!Ref RequestsLayer]
      Environment:
        Variables:
          QUEUE_URL: !Ref ReviewQueue
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          GITHUB_TOKEN_ARN: !If [GitHubEnabled, !Ref GitHubTokenSecret, '']
          GITLAB_TOKEN_ARN: !If [GitLabEnabled, !Ref GitLabTokenSecret, '']
          GITLAB_API_URL: !Ref GitLabApiUrl
          REPO_ALLOWLIST: !Ref RepoAllowlist
          COST_TABLE_NAME: !If [CostTableEnabled, !Ref CostTableName, '']
          MERGE_ON_LOW_SEVERITY: 'true'
          MERGE_ON_MEDIUM_SEVERITY: 'false'
          CLOSE_ON_HIGH_SEVERITY: 'true'

  # SQS event source -> triggers the worker (delivers failures to the DLQ)
  WorkerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref WorkerFunction
      EventSourceArn: !GetAtt ReviewQueue.Arn
      BatchSize: 1
      Enabled: true

  # ==================================================================
  # Cognito - access control for direct API callers.
  # The authorizer Lambda validates Bearer tokens against this pool;
  # Git-provider webhooks are exempted inside the authorizer.
  # Users are created by an admin: aws cognito-idp admin-create-user ...
  # ==================================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-reviewer-users'
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-api'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  AuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole

  AuthorizerRolePolicies:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PRReview-Authorizer
      Roles: [!Ref AuthorizerRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    DependsOn: AuthorizerRolePolicies
    Properties:
      FunctionName: !Ref AuthorizerFunctionName
      Role: !GetAtt AuthorizerRole.Arn
      Runtime: python3.12
      Handler: authorizer.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Sub '${CodeKeyPrefix}/authorizer.zip'
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPool
          CLIENT_ID: !Ref CognitoUserPoolClient

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ReviewApi}/authorizers/*'

  # ==================================================================
  # API Gateway - public webhook endpoint (Lambda proxy)
  # ==================================================================
  ReviewApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Ref ApiName
      Description: Signature-verified webhook endpoint that buffers events into SQS
      EndpointConfiguration:
        Types: [REGIONAL]

  WebhookResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ReviewApi
      ParentId: !GetAtt ReviewApi.RootResourceId
      PathPart: webhook

  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CognitoAuthorizer
      RestApiId: !Ref ReviewApi
      Type: REQUEST
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunction.Arn}/invocations'
      IdentitySource: method.request.header.User-Agent
      AuthorizerResultTtlInSeconds: 0

  WebhookMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ReviewApi
      ResourceId: !Ref WebhookResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IngestFunction.Arn}/invocations'
        PassthroughBehavior: WHEN_NO_MATCH
      MethodResponses:
        - StatusCode: '200'
        - StatusCode: '401'
        - StatusCode: '403'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: WebhookMethod
    Properties:
      RestApiId: !Ref ReviewApi

  # ==================================================================
  # WAF - rate-based rule (abuse / leaked-URL protection)
  # ==================================================================
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${ApiName}-waf-webacl'
      Description: Rate-based rule protecting the PR review webhook from abuse
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      Rules:
        - Name: RateLimitRule
          Priority: 1
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimit
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: PRReviewWAFRateRule
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: PRReviewWebACL

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: ProdStage
    Properties:
      ResourceArn: !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/${ReviewApi}/stages/prod'
      WebACLArn: !GetAtt WebAcl.Arn

  # Stage-level throttling
  ProdStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ReviewApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: !Ref ApiStageRateLimit
          ThrottlingBurstLimit: !Ref ApiStageBurstLimit
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false
          CachingEnabled: false

  # ==================================================================
  # Observability - CloudWatch alarms + Budget
  # ==================================================================
  WorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${LambdaFunctionName}-errors'
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 0
      TreatMissingData: notBreaching
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunctionName
      Period: 300
      Statistic: Sum

  IngestErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${IngestFunctionName}-errors'
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 0
      TreatMissingData: notBreaching
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestFunctionName
      Period: 300
      Statistic: Sum

  AuthorizerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AuthorizerFunctionName}-errors'
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 0
      TreatMissingData: notBreaching
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref AuthorizerFunctionName
      Period: 300
      Statistic: Sum

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ApiName}-5xx'
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 0
      TreatMissingData: notBreaching
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Dimensions:
        - Name: ApiName
          Value: !Ref ApiName
        - Name: Stage
          Value: prod
      Period: 300
      Statistic: Sum

  # Optional budget that pages on spend (configure SNS topics as needed).
  SpendBudget:
    Type: AWS::Budgets::Budget
    Condition: NotifyEnabled
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimit
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail

Outputs:
  WebhookUrl:
    Description: Register this URL as the GitHub/GitLab webhook. Signatures verified per provider.
    Value: !Sub 'https://${ReviewApi}.execute-api.${AWS::Region}.amazonaws.com/prod/webhook'

  QueueUrl:
    Description: SQS queue URL
    Value: !Ref ReviewQueue

  DlqUrl:
    Description: Dead-letter queue URL (poison messages land here)
    Value: !Ref ReviewQueueDLQ

  WorkerLambdaArn:
    Description: Worker Lambda ARN
    Value: !GetAtt WorkerFunction.Arn

  IngestLambdaArn:
    Description: Ingest Lambda ARN
    Value: !GetAtt IngestFunction.Arn

  ModelId:
    Description: Bedrock model currently in use
    Value: !Ref BedrockModelId

  UserPoolId:
    Description: Cognito User Pool ID (create users with admin-create-user)
    Value: !Ref CognitoUserPool

  CognitoClientId:
    Description: Cognito App Client ID for token issuance
    Value: !Ref CognitoUserPoolClient

  AuthorizerLambdaArn:
    Description: Cognito token authorizer Lambda ARN
    Value: !GetAtt AuthorizerFunction.Arn

  CostTableName:
    Description: DynamoDB table for cost attribution
    Value: !Ref CostTableName
    Condition: CostTableEnabled