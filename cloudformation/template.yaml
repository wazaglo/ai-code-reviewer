AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AI Code Reviewer - production-hardened automated PR review on Amazon Bedrock.
  API Gateway (webhook, signature-verified) -> Ingest Lambda -> SQS (+DLQ) ->
  Worker Lambda -> Bedrock Nova -> GitHub comment. Secrets in AWS Secrets
  Manager, X-Ray tracing, CloudWatch alarms, WAF + stage throttling for cost guard.

Parameters:
  # ------------------------------------------------------------------
  # Code hosting (populated by ./deploy/deploy.sh)
  # ------------------------------------------------------------------
  CodeBucket:
    Type: String
    Description: S3 bucket that holds the packaged Lambda code and layer zips.

  CodeKeyPrefix:
    Type: String
    Default: pr-reviewer
    Description: S3 object key prefix under CodeBucket for the packaged artifacts.

  # ------------------------------------------------------------------
  # Naming
  # ------------------------------------------------------------------
  QueueName:
    Type: String
    Default: PR-Review-Queue
    Description: SQS queue that buffers GitHub webhook events.

  LambdaFunctionName:
    Type: String
    Default: PR-Review-Worker
    Description: Worker Lambda that processes queued pull requests.

  IngestFunctionName:
    Type: String
    Default: PR-Review-Ingest
    Description: Ingest/verifier Lambda behind the webhook.

  ApiName:
    Type: String
    Default: PR-Reviewer-API
    Description: REST API Gateway name.

  # ------------------------------------------------------------------
  # Bedrock model - change the ARN/model here in ONE place
  # ------------------------------------------------------------------
  BedrockModelId:
    Type: String
    Default: 'amazon.nova-2-lite-v1:0'
    AllowedPattern: '.+'
    Description: >
      Bedrock foundation-model ID used for AI analysis. Change to switch models;
      the IAM permission ARN and the runtime BOTH derive from this field.

  # ------------------------------------------------------------------
  # Secrets (never logged / echoed)
  # ------------------------------------------------------------------
  GitHubWebhookSecret:
    Type: String
    NoEcho: true
    Description: >
      The secret you configure against your GitHub webhook. Used to verify the
      X-Hub-Signature-256 on every request so only GitHub can trigger reviews.

  GitHubToken:
    Type: String
    NoEcho: true
    Description: >
      GitHub Personal Access Token (fine-grained, contents:read +
      pull_requests:write) used to clone and post comments. Leave empty for
      public-repo dry runs.

  # ------------------------------------------------------------------
  # Compute sizing
  # ------------------------------------------------------------------
  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240

  LambdaTimeout:
    Type: Number
    Default: 300
    MinValue: 3
    MaxValue: 900

  VisibilityTimeout:
    Type: Number
    Default: 360
    MinValue: 30
    Description: SQS visibility timeout (must be >= Lambda timeout).

  # DLQ: number of delivery attempts before a message is redriven to the DLQ.
  MaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000

  # Comma-separated org/repo allowlist. Default empty = allow anything.
  RepoAllowlist:
    Type: String
    Default: ''
    Description: 'Comma-separated list of allowed org/repo, e.g. acme/web,acme/app. Empty allows all.'

  # ------------------------------------------------------------------
  # Rate limiting / cost protection
  # ------------------------------------------------------------------
  ApiStageRateLimit:
    Type: Number
    Default: 10
    MinValue: 0
    Description: Requests per second at the API stage (0 = unlimited).

  ApiStageBurstLimit:
    Type: Number
    Default: 20
    MinValue: 0

  WafRateLimit:
    Type: Number
    Default: 200
    MinValue: 100
    MaxValue: 2000000000
    Description: WAF rule limit - max requests from a single IP within 5 minutes.

  MonthlyBudgetLimit:
    Type: Number
    Default: 50
    Description: Monthly AWS spend budget limit in USD that triggers an alarm.

  NotificationEmail:
    Type: String
    Default: ''
    Description: Email that receives cost/spend budget and alarm notifications.

Conditions:
  NotifyEnabled: !Not [ !Equals [ !Ref NotificationEmail, '' ] ]

Resources:
  # ==================================================================
  # Secrets Manager - never store tokens in env vars or code
  # ==================================================================
  WebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: GitHub webhook HMAC secret used to verify webhook signatures
      SecretString: !Ref GitHubWebhookSecret

  GitHubTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: GitHub PAT used to clone repos and post PR comments
      SecretString: !Ref GitHubToken

  # ==================================================================
  # SQS - main review queue + dead-letter queue
  # ==================================================================
  ReviewQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref QueueName
      VisibilityTimeout: !Ref VisibilityTimeout
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReviewQueueDLQ.Arn
        maxReceiveCount: !Ref MaxReceiveCount

  ReviewQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${QueueName}-dlq'
      MessageRetentionPeriod: 1209600

  # ==================================================================
  # IAM - ingest Lambda role (verify + enqueue)
  # ==================================================================
  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole

  IngestRolePolicies:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PRReview-Ingest
      Roles: [!Ref IngestRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt ReviewQueue.Arn
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: '*'

  # Separate policy ONLY when a webhook secret is configured (avoids an
  # empty Resource on the conditional secrets statement).
  IngestSecretPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PRReview-Ingest-Secret
      Roles: [!Ref IngestRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref WebhookSecret

  # ==================================================================
  # IAM - worker Lambda role (read + analyze + post)
  # ==================================================================
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole

  WorkerRolePolicies:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PRReview-Worker
      Roles: [!Ref WorkerRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ReceiveMessage
            Resource: !GetAtt ReviewQueue.Arn
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref GitHubTokenSecret
          - Effect: Allow
            Action: bedrock:InvokeModel
            Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: '*'

  # ==================================================================
  # Lambda layer - bundles the `requests` dependency
  # ==================================================================
  RequestsLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: PR-Review-requests
      Description: requests + urllib3 + certifi runtime dependency
      Content:
        S3Bucket: !Ref CodeBucket
        S3Key: !Sub '${CodeKeyPrefix}/requests-layer.zip'
      CompatibleRuntimes:
        - python3.12

  # ==================================================================
  # Lambda - ingest / verifier (webhook proxy)
  # ==================================================================
  IngestFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - IngestRolePolicies
      - IngestSecretPolicy
    Properties:
      FunctionName: !Ref IngestFunctionName
      Role: !GetAtt IngestRole.Arn
      Runtime: python3.12
      Handler: ingest.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Sub '${CodeKeyPrefix}/ingest.zip'
      Timeout: 30
      MemorySize: 128
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          QUEUE_URL: !Ref ReviewQueue
          WEBSECRET_ARN: !Ref WebhookSecret

  # Allow API Gateway to invoke the ingest function from the webhook method.
  IngestInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IngestFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ReviewApi}/*/POST/webhook'

  # ==================================================================
  # Lambda - review worker (SQS consumer)
  # ==================================================================
  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerRolePolicies
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Role: !GetAtt WorkerRole.Arn
      Runtime: python3.12
      Handler: lambda_function.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Sub '${CodeKeyPrefix}/lambda_function.zip'
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref MemorySize
      TracingConfig:
        Mode: Active
      Layers: [!Ref RequestsLayer]
      Environment:
        Variables:
          QUEUE_URL: !Ref ReviewQueue
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          GITHUB_TOKEN_ARN: !Ref GitHubTokenSecret
          REPO_ALLOWLIST: !Ref RepoAllowlist

  # SQS event source -> triggers the worker (delivers failures to the DLQ)
  WorkerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref WorkerFunction
      EventSourceArn: !GetAtt ReviewQueue.Arn
      BatchSize: 1
      Enabled: true

  # ==================================================================
  # API Gateway - public webhook endpoint (Lambda proxy)
  # ==================================================================
  ReviewApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Ref ApiName
      Description: Signature-verified webhook endpoint that buffers events into SQS
      EndpointConfiguration:
        Types: [REGIONAL]

  WebhookResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ReviewApi
      ParentId: !GetAtt ReviewApi.RootResourceId
      PathPart: webhook

  WebhookMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ReviewApi
      ResourceId: !Ref WebhookResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IngestFunction.Arn}/invocations'
        PassthroughBehavior: WHEN_NO_MATCH
      MethodResponses:
        - StatusCode: '200'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: WebhookMethod
    Properties:
      RestApiId: !Ref ReviewApi
      StageName: prod

  # ==================================================================
  # WAF - rate-based rule (abuse / leaked-URL protection)
  # ==================================================================
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${ApiName}-waf-webacl'
      Description: Rate-based rule protecting the PR review webhook from abuse
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      Rules:
        - Name: RateLimitRule
          Priority: 1
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimit
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: PRReviewWAFRateRule
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: PRReviewWebACL

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/${ReviewApi}/stages/prod'
      WebACLArn: !GetAtt WebAcl.Arn

  # Stage-level throttling
  ProdStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ReviewApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: !Ref ApiStageRateLimit
          ThrottlingBurstLimit: !Ref ApiStageBurstLimit
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false
          CachingEnabled: false

  # ==================================================================
  # Observability - CloudWatch alarms + Budget
  # ==================================================================
  WorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${LambdaFunctionName}-errors'
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 0
      TreatMissingData: notBreaching
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunctionName
      Period: 300
      Statistic: Sum

  IngestErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${IngestFunctionName}-errors'
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 0
      TreatMissingData: notBreaching
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestFunctionName
      Period: 300
      Statistic: Sum

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ApiName}-5xx'
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 0
      TreatMissingData: notBreaching
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Dimensions:
        - Name: ApiName
          Value: !Ref ApiName
        - Name: Stage
          Value: prod
      Period: 300
      Statistic: Sum

  # Optional budget that pages on spend (configure SNS topics as needed).
  SpendBudget:
    Type: AWS::Budgets::Budget
    Condition: NotifyEnabled
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimit
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail

Outputs:
  WebhookUrl:
    Description: Register this URL as the GitHub webhook. GitHub signs every request.
    Value: !Sub 'https://${ReviewApi}.execute-api.${AWS::Region}.amazonaws.com/prod/webhook'

  QueueUrl:
    Description: SQS queue URL
    Value: !Ref ReviewQueue

  DlqUrl:
    Description: Dead-letter queue URL (poison messages land here)
    Value: !Ref ReviewQueueDLQ

  WorkerLambdaArn:
    Description: Worker Lambda ARN
    Value: !GetAtt WorkerFunction.Arn

  IngestLambdaArn:
    Description: Ingest Lambda ARN
    Value: !GetAtt IngestFunction.Arn

  ModelId:
    Description: Bedrock model currently in use
    Value: !Ref BedrockModelId
